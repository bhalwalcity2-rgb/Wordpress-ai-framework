name: Deploy — Las Vegas Junk Car Buyers

on:
  push:
    branches:
      - main
    paths:
      - "wordpress/themes/kadence-child-lvjcb/**"
      - ".github/workflows/deploy-lvjcb.yml"
      - "scripts/image-manifest.json"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy theme to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Pexels images
        uses: actions/cache@v4
        with:
          path: wordpress/themes/kadence-child-lvjcb/assets/images/pexels
          key: pexels-${{ hashFiles('scripts/image-manifest.json') }}

      - name: Fetch Pexels images
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY not set, skipping image fetch"
            exit 0
          fi
          chmod +x scripts/fetch-pexels-images.sh
          bash scripts/fetch-pexels-images.sh

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LVJCB_FTP_HOST }}
          username: ${{ secrets.LVJCB_FTP_USER }}
          password: ${{ secrets.LVJCB_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./wordpress/themes/kadence-child-lvjcb/
          server-dir: ./wp-content/themes/kadence-child-lvjcb/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
