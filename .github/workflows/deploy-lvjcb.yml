name: Deploy — Las Vegas Junk Car Buyers

on:
  push:
    branches:
      - main
    paths:
      - "wordpress/themes/kadence-child-lvjcb/**"
      - ".github/workflows/deploy-lvjcb.yml"
      - "scripts/image-manifest.json"
  workflow_dispatch:

jobs:
  # Runs the repository's own validation workflow. Deployment waits on it,
  # so a commit that fails secret scanning, PHP lint, or the content
  # schema never reaches the live theme. Declared as a job rather than
  # `needs: [validate]` because the two workflows are separate files and
  # `needs:` cannot cross that boundary.
  validate:
    name: Validate before deploy
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy theme to production
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Pexels images
        uses: actions/cache@v4
        with:
          path: wordpress/themes/kadence-child-lvjcb/assets/images/pexels
          key: pexels-${{ hashFiles('scripts/image-manifest.json') }}
          # Adding one image to the manifest changes the hash, and without
          # a fallback that empties the cache and re-runs every query —
          # handing back different photos for slugs that were already
          # settled. Restoring the previous cache keeps those files, and
          # the fetch script still downloads whatever is missing.
          restore-keys: |
            pexels-

      - name: Fetch Pexels images
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY not set, skipping image fetch"
            exit 0
          fi
          chmod +x scripts/fetch-pexels-images.sh
          bash scripts/fetch-pexels-images.sh

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LVJCB_FTP_HOST }}
          username: ${{ secrets.LVJCB_FTP_USER }}
          password: ${{ secrets.LVJCB_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./wordpress/themes/kadence-child-lvjcb/
          server-dir: ./wp-content/themes/kadence-child-lvjcb/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
